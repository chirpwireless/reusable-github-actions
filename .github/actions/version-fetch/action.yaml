name: 'Fetch Version'
description: 'Fetches published build version from a git ref. By default, it takes the last build or release version depending on the branch.'

inputs:
  git-ref:
    description: 'Git ref (branch, tag) to fetch build version'
    required: false
    default: ''
  check-name:
    description: 'The name of the check containing the build version'
    required: false
    default: 'chirp:version'
  extra-versions:
    description: 'Additional versions, one NAME=check-name per line. Each is read from the check-run of the same ref'
    required: false
    default: ''
  github-token:
    description: 'The GitHub token'
    required: true
    default: ${{ github.token }}

outputs:
  version:
    description: 'Build version fetched from git ref'
    value: ${{ steps.fetch-version.outputs.result }}
  extra-env:
    description: 'NAME=value lines for the additional versions, empty without extra-versions'
    value: ${{ steps.fetch-extra.outputs.result }}

runs:
  using: 'composite'
  steps:
    - id: check-extra
      if: ${{ inputs.extra-versions != '' }}
      uses: actions/github-script@v7
      env:
        EXTRA_VERSIONS: ${{ inputs.extra-versions }}
      with:
        script: |
          const { parseExtraVersions } = require(`${process.env.GITHUB_ACTION_PATH}/script.js`)
          try {
            parseExtraVersions(process.env.EXTRA_VERSIONS)
          } catch (e) {
            core.setFailed(e.message)
          }
    - id: fetch-ref
      uses: actions/github-script@v7
      env:
        GIT_REF: ${{ inputs.git-ref }}
      with:
        result-encoding: string
        github-token: ${{ inputs.github-token }}
        script: |
          const { fetchRef } = require(`${process.env.GITHUB_ACTION_PATH}/script.js`)
          return fetchRef({ github, context, core });
    - id: fetch-version
      uses: actions/github-script@v7
      env:
        GIT_REF: ${{ steps.fetch-ref.outputs.result }}
        CHECK_NAME: ${{ inputs.check-name }}
      with:
        result-encoding: string
        github-token: ${{ inputs.github-token }}
        script: |
          const { fetchVersion } = require(`${process.env.GITHUB_ACTION_PATH}/script.js`)
          return fetchVersion({ github, context, core });
    - id: fetch-extra
      if: ${{ inputs.extra-versions != '' }}
      uses: actions/github-script@v7
      env:
        GIT_REF: ${{ steps.fetch-ref.outputs.result }}
        EXTRA_VERSIONS: ${{ inputs.extra-versions }}
      with:
        result-encoding: string
        github-token: ${{ inputs.github-token }}
        script: |
          const { fetchExtra } = require(`${process.env.GITHUB_ACTION_PATH}/script.js`)
          return fetchExtra({ github, context, core });
    - id: log-output
      shell: bash
      run: echo ${{ steps.fetch-version.outputs.result }}