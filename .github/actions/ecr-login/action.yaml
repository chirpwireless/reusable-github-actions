name: 'EcrLogin'
description: >-
  Logs in to AWS ECR through GitHub OIDC so a build can push an image there next to ghcr.
  A no-op, and never a failure, when the calling workflow has no id-token: write permission,
  the role or registry is not configured, or AWS rejects the login.

inputs:
  role-arn:
    description: "IAM role to assume through OIDC (the AWS_ECR_PUSH_ROLE_ARN Actions variable)"
    default: ""
  registry:
    description: "ECR registry host (the AWS_ECR_REGISTRY Actions variable)"
    default: ""
  region:
    description: "AWS region of the registry"
    default: "eu-central-1"

outputs:
  registry:
    description: "ECR registry host when the login succeeded, empty otherwise"
    value: ${{ steps.result.outputs.registry }}

runs:
  using: "composite"
  steps:
    - id: gate
      shell: bash
      env:
        ROLE_ARN: ${{ inputs.role-arn }}
        REGISTRY: ${{ inputs.registry }}
      run: |
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ROLE_ARN" ] && [ -n "$REGISTRY" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "ECR push skipped: id-token permission, role or registry is not set"
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        fi
    - id: aws
      if: steps.gate.outputs.enabled == 'true'
      continue-on-error: true
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}
    - id: login
      if: steps.aws.outcome == 'success'
      continue-on-error: true
      uses: aws-actions/amazon-ecr-login@v2
    - id: result
      shell: bash
      env:
        LOGIN_OUTCOME: ${{ steps.login.outcome }}
        REGISTRY: ${{ inputs.registry }}
      run: |
        if [ "$LOGIN_OUTCOME" = "success" ]; then
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
        else
          echo "registry=" >> "$GITHUB_OUTPUT"
        fi
