name: 'EcrLogin'
description: >-
  Logs in to AWS ECR through GitHub OIDC so a build can push an image there next to ghcr.
  Only on pushes to integration branches (main, master, develop, dev, test); pull-request images stay on ghcr.
  The role is the calling repository's own: ecr-push-<repository name> in the registry's AWS account, which only trusts that
  repository's exact branches and lets it push only its own images. A no-op, and never a failure, when the calling workflow has
  no id-token: write permission, the registry is not configured, or AWS rejects the login (a repository without a role).

inputs:
  role-name-prefix:
    description: "Prefix of the per-repository role name, as in the github-oidc-ecr-push module"
    default: "ecr-push-"
  registry:
    description: "ECR registry host (the AWS_ECR_REGISTRY Actions variable)"
    default: ""

outputs:
  registry:
    description: "ECR registry host when the login succeeded, empty otherwise"
    value: ${{ steps.result.outputs.registry }}

runs:
  using: "composite"
  steps:
    - id: gate
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        ROLE_PREFIX: ${{ inputs.role-name-prefix }}
      run: |
        case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
          push:refs/heads/main|push:refs/heads/master|push:refs/heads/develop|push:refs/heads/dev|push:refs/heads/test|workflow_dispatch:refs/heads/main|workflow_dispatch:refs/heads/master|workflow_dispatch:refs/heads/develop|workflow_dispatch:refs/heads/dev|workflow_dispatch:refs/heads/test) on_branch=true ;;
          *) on_branch=false ;;
        esac
        account="${REGISTRY%%.*}"
        region=""
        if [[ "$REGISTRY" =~ ^[0-9]{12}\.dkr\.ecr\.([a-z0-9-]+)\.amazonaws\.com$ ]]; then
          region="${BASH_REMATCH[1]}"
        fi
        if [ "$on_branch" = true ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$region" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "region=$region" >> "$GITHUB_OUTPUT"
          echo "role-arn=arn:aws:iam::${account}:role/${ROLE_PREFIX}${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
        else
          echo "ECR copy skipped: not an integration branch push, or id-token permission or a valid ECR registry host is not set"
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        fi
    - id: aws
      if: steps.gate.outputs.enabled == 'true'
      continue-on-error: true
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: ${{ steps.gate.outputs.role-arn }}
        aws-region: ${{ steps.gate.outputs.region }}
    - id: login
      if: steps.aws.outcome == 'success'
      continue-on-error: true
      uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
    - id: result
      shell: bash
      env:
        LOGIN_OUTCOME: ${{ steps.login.outcome }}
        REGISTRY: ${{ inputs.registry }}
      run: |
        if [ "$LOGIN_OUTCOME" = "success" ]; then
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
        else
          echo "registry=" >> "$GITHUB_OUTPUT"
        fi
