name: 'EcrLogin'
description: >-
  Logs in to AWS ECR through GitHub OIDC. Used only by the build-ecr-copy.yml workflow; the role trusts jobs of that
  workflow alone. Any failure fails the job.

inputs:
  role-arn:
    description: "IAM role to assume through OIDC (the AWS_ECR_PUSH_ROLE_ARN Actions variable)"
    required: true
  region:
    description: "AWS region of the registry"
    default: "eu-central-1"

runs:
  using: "composite"
  steps:
    - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}
    - uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
