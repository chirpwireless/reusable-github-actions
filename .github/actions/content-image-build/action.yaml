name: 'Build a content-tagged image'
description: 'Builds the image reproducibly with pinned BuildKit, without pushing, and returns its config digest'

inputs:
  image:
    description: 'Image repository, ghcr.io/<owner>/<name>'
    required: true
  tag:
    description: 'Content tag of the image'
    required: true
  dockerfile:
    description: 'Path to the Dockerfile from the repository root'
    required: true
  buildkit-image:
    description: 'BuildKit image with digest'
    required: true

outputs:
  config:
    description: 'Config digest of the built image'
    value: ${{ steps.config.outputs.config }}

runs:
  using: 'composite'
  steps:
    - uses: docker/setup-buildx-action@v3
      with:
        driver-opts: image=${{ inputs.buildkit-image }}
    - id: build
      uses: docker/build-push-action@v5
      env:
        SOURCE_DATE_EPOCH: "0"
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        provenance: false
        sbom: false
        no-cache: true
        outputs: type=image,name=${{ inputs.image }}:${{ inputs.tag }},push=false,rewrite-timestamp=true
    - id: config
      shell: bash
      env:
        METADATA: ${{ steps.build.outputs.metadata }}
      run: |
        config=$("$GITHUB_ACTION_PATH/config-digest.sh")
        echo "config=$config" >> "$GITHUB_OUTPUT"
