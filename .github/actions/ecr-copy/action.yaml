name: 'EcrCopy'
description: >-
  Copies the image just pushed to ghcr into ECR (registry to registry, no rebuild). A tag already in ECR must have the digest of the source image, otherwise the step fails; a target this repository's role may not push fails too. A failed or skipped copy never fails the build,
  except on an integration branch of a service whose deploy/ values already name an ECR registry: there a missing ECR image
  would only surface at deploy time, so the build fails instead.

inputs:
  source:
    description: "ghcr image reference with tag"
    required: true
  target:
    description: "ECR image reference with tag"
    required: true
  registry:
    description: "Output `registry` of the ecr-login step; empty when the login did not happen"
    default: ""

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        TARGET: ${{ inputs.target }}
        REGISTRY: ${{ inputs.registry }}
      run: |
        copied=false
        if [ -n "$REGISTRY" ]; then
          if inspect_err=$(docker buildx imagetools inspect "$TARGET" --raw 2>&1 >"$RUNNER_TEMP/target-manifest"); then
            target_digest="sha256:$(sha256sum <"$RUNNER_TEMP/target-manifest" | cut -d' ' -f1)"
            source_digest="sha256:$(docker buildx imagetools inspect "$SOURCE" --raw | sha256sum | cut -d' ' -f1)"
            if [ "$source_digest" = "$target_digest" ]; then
              echo "$TARGET already exists in ECR with the same digest ($target_digest): nothing to copy"
              exit 0
            fi
            echo "::error::$TARGET already exists in ECR with digest $target_digest, but $SOURCE is $source_digest; tags are immutable, so the image in ECR is not the one just built"
            exit 1
          fi
          if grep -qiE '403 Forbidden|denied:|not authorized to perform' <<<"$inspect_err"; then
            echo "::error::this repository's ECR role may not push $TARGET; the image name must be one of the images listed for this repository in hetzner-k8s live/ecr-push-role/ecr-push-repos.yaml"
            exit 1
          fi
          if docker buildx imagetools create --prefer-index=false --tag "$TARGET" "$SOURCE"; then
            copied=true
          else
            echo "::warning::copy of $SOURCE to ECR failed; the image is in ghcr only"
          fi
        fi
        if [ "$copied" = true ]; then
          exit 0
        fi
        case "$GITHUB_REF" in
          refs/heads/main|refs/heads/master|refs/heads/develop|refs/heads/dev|refs/heads/test) integration=true ;;
          *) integration=false ;;
        esac
        if [ "$integration" = true ] && grep -rhE '\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/chirpwireless/' deploy/ 2>/dev/null | grep -qvE '^\s*#'; then
          echo "::error::deploy/ pulls this service from ECR but the image was not copied there; fix the ECR setup (id-token permission, AWS_ECR_* variables, role) and re-run"
          exit 1
        fi
        echo "ECR copy skipped"
