name: Deploy a microservice to a k8s cluster

on:
  workflow_call:
    inputs:
      service_name:
        description: "The service name to be deployed"
        type: string
        required: true
      version:
        description: "Git reference (branch, tag) of commit to deploy"
        type: string
      environment:
        required: true
        description: "Environment (k8s namespace)"
        type: string
      deploy_dir:
        required: true
        description: "Path to the helm charts"
        type: string
      values_file:
        required: true
        description: "Path to the values file"
        type: string

jobs:
  fetch_version:
    runs-on:
      group: hetzner-k3s-dev
    outputs:
      version: ${{steps.fetch-version.outputs.version}}
    steps:
      - id: fetch-version
        uses: chirpwireless/reusable-github-actions/.github/actions/version-fetch@main
        with:
          git-ref: ${{ inputs.version }}
      - run: |
          echo "Deploying the version ${{steps.fetch-version.outputs.version}}" > $GITHUB_STEP_SUMMARY

  deploy:
    name: "Deploy to ${{inputs.environment}}"
    needs: fetch_version
    runs-on:
      group: ${{ (inputs.environment == 'prod' || inputs.environment == 'kiloiot-prod' || inputs.environment == 'fleet-prod') && 'hetzner-k3s-prod' || (inputs.environment == 'staging' || inputs.environment == 'kiloiot-staging' || inputs.environment == 'fleet-staging') && 'hetzner-k3s-staging' || 'hetzner-k3s-dev' }}
    environment:
      name: ${{ inputs.environment }}
    env:
      IS_PROD: ${{ (inputs.environment == 'prod' || inputs.environment == 'kiloiot-prod' || inputs.environment == 'fleet-prod') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: ${{ env.IS_PROD != 'true' && 1 || 0 }}
      - name: Production deploys only commits and images from the main branch
        if: env.IS_PROD == 'true'
        shell: sh
        env:
          VERSION: ${{ needs.fetch_version.outputs.version }}
        run: |
          base=main
          git rev-parse -q --verify refs/remotes/origin/main >/dev/null || base=master
          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/$base"; then
            echo "::error::$(git rev-parse --short HEAD) is not on $base: production deploys only commits from $base"
            exit 1
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7}$' || ! git merge-base --is-ancestor "${VERSION##*-}" "refs/remotes/origin/$base"; then
            echo "::error::image $VERSION is not a $base build: production deploys only images built from $base"
            exit 1
          fi
      - uses: azure/setup-helm@v4.2.0
      - name: Helm upgrade
        shell: sh
        run: |
          helm upgrade -i ${{ inputs.service_name }} ${{ inputs.deploy_dir }}/${{ inputs.service_name }} --namespace ${{ inputs.environment }} --wait --atomic --set image.tag=${{ needs.fetch_version.outputs.version }} -f ${{ inputs.values_file }}
