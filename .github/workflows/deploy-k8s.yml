name: Deploy a microservice to a k8s cluster

on:
  workflow_call:
    inputs:
      service_name:
        description: "The service name to be deployed"
        type: string
        required: true
      version:
        description: "Git reference (branch, tag or SHA) of commit to deploy"
        type: string
      environment:
        required: true
        description: "Environment (k8s namespace)"
        type: string
      deploy_dir:
        required: true
        description: "Path to the helm charts"
        type: string
      values_file:
        required: true
        description: "Path to the values file"
        type: string

jobs:
  fetch_version:
    runs-on:
      group: hetzner-k3s-dev
    outputs:
      version: ${{steps.fetch-version.outputs.version}}
      release_sha: ${{steps.verify-release-ref.outputs.sha}}
    steps:
      - id: verify-release-ref
        uses: chirpwireless/reusable-github-actions/.github/actions/verify-release-ref@main
        with:
          git-ref: ${{ inputs.version }}
          environment: ${{ inputs.environment }}
      - id: fetch-version
        uses: chirpwireless/reusable-github-actions/.github/actions/version-fetch@main
        with:
          git-ref: ${{ inputs.version && steps.verify-release-ref.outputs.sha || inputs.version }}
      - name: Check the version was built from the verified commit
        if: inputs.version != '' && steps.verify-release-ref.outputs.sha != ''
        env:
          SHA: ${{ steps.verify-release-ref.outputs.sha }}
          VERSION: ${{ steps.fetch-version.outputs.version }}
        run: |
          case "$VERSION" in
            *"-${SHA:0:7}"*) ;;
            *) echo "::error::Version '$VERSION' was not built from ${SHA}"; exit 1 ;;
          esac
      - run: |
          echo "Deploying the version ${{steps.fetch-version.outputs.version}}" > $GITHUB_STEP_SUMMARY

  deploy:
    name: "Deploy to ${{inputs.environment}}"
    needs: fetch_version
    runs-on:
      group: ${{ (inputs.environment == 'prod' || inputs.environment == 'kiloiot-prod' || inputs.environment == 'fleet-prod') && 'hetzner-k3s-prod' || (inputs.environment == 'staging' || inputs.environment == 'kiloiot-staging' || inputs.environment == 'fleet-staging') && 'hetzner-k3s-staging' || 'hetzner-k3s-dev' }}
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.fetch_version.outputs.release_sha || inputs.version }}
      - uses: azure/setup-helm@v4.2.0
      - name: Helm upgrade
        shell: sh
        run: |
          helm upgrade -i ${{ inputs.service_name }} ${{ inputs.deploy_dir }}/${{ inputs.service_name }} --namespace ${{ inputs.environment }} --wait --atomic --set image.tag=${{ needs.fetch_version.outputs.version }} -f ${{ inputs.values_file }}
