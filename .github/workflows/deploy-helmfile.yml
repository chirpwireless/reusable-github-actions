name: Deploy a microservice using helmfile

on:
  workflow_call:
    inputs:
      version:
        description: "Git reference (branch, tag or SHA) of commit to deploy"
        type: string
      environment:
        required: true
        description: "Environment"
        type: string
      namespace:
        description: "k8s namespace"
        type: string
      deploy_dir:
        required: true
        description: "Path to the helm charts"
        type: string
      extra_versions:
        description: "Additional versions, one VERSION_NAME=check-name per line, exported to the helmfile step. A commit without the check gets no variable: read it with requiredEnv"
        type: string
        default: ""
      pin_images:
        description: "Deploy every ghcr.io/<owner> image by the digest a push build of the commit recorded; the caller grants actions: read. IMAGE_PINS_FILE lists image:tag@digest for helmfile hooks. A render without any ghcr.io/<owner> image fails"
        type: boolean
        default: false
      render_policy_cmd:
        description: "Path, relative to the repository root, of an executable the deploy job runs as the gate of the deploy: '<path> source' before any helmfile call, then '<path> render' with the output of helmfile template (same arguments and environment as the apply that follows, the pinned render with pin_images) on stdin. Either failing stops the job before apply. It gets RENDER_POLICY_ENVIRONMENT, RENDER_POLICY_NAMESPACE and RENDER_POLICY_DEPLOY_DIR. Empty: no gate, the deploy is unchanged"
        type: string
        default: ""

env:
  HOME: /home/runner

jobs:
  fetch_version:
    # Reads the GitHub API only: a dev runner must not choose what prod deploys.
    runs-on: ubuntu-latest
    outputs:
      version: ${{steps.fetch-version.outputs.version}}
      extra_env: ${{steps.fetch-version.outputs.extra-env}}
      sha: ${{steps.digests.outputs.sha}}
      pins: ${{steps.digests.outputs.pins}}
    steps:
      - id: fetch-version
        uses: chirpwireless/reusable-github-actions/.github/actions/version-fetch@main
        with:
          git-ref: ${{ inputs.version }}
          extra-versions: ${{ inputs.extra_versions }}
          production: ${{ inputs.environment == 'prod' || inputs.environment == 'kiloiot-prod' || inputs.environment == 'fleet-prod' }}
      - id: digests
        if: ${{ inputs.pin_images }}
        uses: chirpwireless/reusable-github-actions/.github/actions/trusted-image-digests@main
        with:
          git-ref: ${{ inputs.version }}
          production: ${{ inputs.environment == 'prod' || inputs.environment == 'kiloiot-prod' || inputs.environment == 'fleet-prod' }}
      - env:
          VERSION: ${{ steps.fetch-version.outputs.version }}
          EXTRA_ENV: ${{ steps.fetch-version.outputs.extra-env }}
        run: |
          { printf 'Deploying the version %s\n' "$VERSION"; [ -z "$EXTRA_ENV" ] || printf '%s\n' "$EXTRA_ENV"; } > "$GITHUB_STEP_SUMMARY"

  deploy:
    name: "Deploy to ${{inputs.environment}}"
    needs: fetch_version
    runs-on:
      group: ${{ (inputs.environment == 'prod' || inputs.environment == 'kiloiot-prod' || inputs.environment == 'fleet-prod') && 'hetzner-k3s-prod' || (inputs.environment == 'staging' || inputs.environment == 'kiloiot-staging' || inputs.environment == 'fleet-staging') && 'hetzner-k3s-staging' || 'hetzner-k3s-dev' }}
    environment:
      name: ${{ inputs.environment }}
    env:
      IS_PROD: ${{ (inputs.environment == 'prod' || inputs.environment == 'kiloiot-prod' || inputs.environment == 'fleet-prod') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: ${{ env.IS_PROD != 'true' && 1 || 0 }}
      - name: Production deploys only commits and images from the main branch
        if: env.IS_PROD == 'true'
        shell: sh
        env:
          VERSION: ${{ needs.fetch_version.outputs.version }}
        run: |
          base=main
          git rev-parse -q --verify refs/remotes/origin/main >/dev/null || base=master
          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/$base"; then
            echo "::error::$(git rev-parse --short HEAD) is not on $base: production deploys only commits from $base"
            exit 1
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7}$' || ! git merge-base --is-ancestor "${VERSION##*-}" "refs/remotes/origin/$base"; then
            echo "::error::image $VERSION is not a $base build: production deploys only images built from $base"
            exit 1
          fi
      - name: The checked-out commit is the one whose digests were read
        if: ${{ inputs.pin_images }}
        env:
          SHA: ${{ needs.fetch_version.outputs.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), digests are of $SHA"; exit 1; }
      - name: Pin images by digest
        if: ${{ inputs.pin_images }}
        uses: chirpwireless/reusable-github-actions/.github/actions/image-pins@main
        with:
          pins: ${{ needs.fetch_version.outputs.pins }}
      - name: Export the additional versions
        env:
          EXTRA_ENV: ${{ needs.fetch_version.outputs.extra_env }}
        run: |
          [ -n "$EXTRA_ENV" ] || exit 0
          if LC_ALL=C grep -Evxq 'VERSION_[A-Z0-9_]+=[A-Za-z0-9_][A-Za-z0-9._-]{0,127}' <<< "$EXTRA_ENV"; then
            echo "::error::an additional version is not a VERSION_NAME=tag line"
            exit 1
          fi
          printf '%s\n' "$EXTRA_ENV" >> "$GITHUB_ENV"
      - name: Deploy using helmfile
        env:
          VERSION: ${{ needs.fetch_version.outputs.version }}
          PIN_IMAGES: ${{ inputs.pin_images }}
          RENDER_POLICY_CMD: ${{ inputs.render_policy_cmd }}
          RENDER_POLICY_ENVIRONMENT: ${{ inputs.environment }}
          RENDER_POLICY_NAMESPACE: ${{ inputs.namespace || inputs.environment }}
          RENDER_POLICY_DEPLOY_DIR: ${{ inputs.deploy_dir }}
        run: |
          policy=
          if [ -n "$RENDER_POLICY_CMD" ]; then
            if ! printf '%s\n' "$RENDER_POLICY_CMD" | LC_ALL=C grep -Eqx '[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*' \
              || printf '%s\n' "$RENDER_POLICY_CMD" | grep -Eq '(^|/)\.\.?(/|$)'; then
              echo "::error::render_policy_cmd is not a relative path inside the repository"
              exit 1
            fi
            policy=$PWD/$RENDER_POLICY_CMD
            if [ ! -f "$policy" ] || [ ! -x "$policy" ]; then
              echo "::error::render_policy_cmd $RENDER_POLICY_CMD is not an executable file of the commit"
              exit 1
            fi
            "$policy" source || { echo "::error::the deploy gate $RENDER_POLICY_CMD refused the source of the commit"; exit 1; }
          fi
          cd ${{ inputs.deploy_dir }}
          if [ "$PIN_IMAGES" = true ]; then
            helmfile -e ${{inputs.environment}} -n ${{inputs.namespace || inputs.environment}} template --post-renderer "${IMAGE_PINS_RENDERER:?}" > "$RUNNER_TEMP/pinned-render.yaml"
            "$IMAGE_PINS_RENDERER" --check < "$RUNNER_TEMP/pinned-render.yaml"
            if [ -n "$policy" ]; then
              "$policy" render < "$RUNNER_TEMP/pinned-render.yaml" || { echo "::error::the deploy gate $RENDER_POLICY_CMD refused the render"; exit 1; }
            fi
            helmfile -e ${{inputs.environment}} -n ${{inputs.namespace || inputs.environment}} apply --post-renderer "$IMAGE_PINS_RENDERER"
          else
            if [ -n "$policy" ]; then
              helmfile -e ${{inputs.environment}} -n ${{inputs.namespace || inputs.environment}} template > "$RUNNER_TEMP/policy-render.yaml"
              "$policy" render < "$RUNNER_TEMP/policy-render.yaml" || { echo "::error::the deploy gate $RENDER_POLICY_CMD refused the render"; exit 1; }
            fi
            helmfile -e ${{inputs.environment}} -n ${{inputs.namespace || inputs.environment}} apply
          fi
