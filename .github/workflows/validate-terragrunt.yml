name: Validate a Terraform with Terragrunt
on:
  workflow_call:
    inputs:
      tf_version:
        description: "Terraform version to use"
        type: string
        default: "1.14.6"
      tg_version:
        description: "Terragrunt version to use"
        type: string
        default: "0.99.5"
      tg_working_dir:
        description: "Directory in which Terragrunt will be invoked"
        type: string
        required: true
      tg_parallelism:
        description: "Max units Terragrunt validates concurrently"
        type: number
        default: 2
    outputs:
      new-version:
        description: "The new service version"
        value: ${{ jobs.terragrunt-validate.outputs.new_version }}

env:
  HOME: ${{github.workspace}}

jobs:
  terragrunt-validate:
    # Terraform needs its release and provider sites, which the self-hosted runners do not reach.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: version
        uses: chirpwireless/reusable-github-actions/.github/actions/calendar-version@main

      - name: "Create a summary"
        run: |
          echo "Building a new revision ${{steps.version.outputs.new_version}}" > $GITHUB_STEP_SUMMARY

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.tf_version }}

      - name: Check terragrunt HCL
        uses: gruntwork-io/terragrunt-action@v3
        env:
          # Disable s3 backend for validation
          TERRAGRUNT_ENABLE_BACKEND: "false"
          # Unbounded --all starts every unit's providers at once and the runner times out on plugin start
          TG_PARALLELISM: ${{ inputs.tg_parallelism }}
          # One provider download shared by all units instead of one per unit
          TG_PROVIDER_CACHE: "true"
          # Configure Git to use the read-only token
          INPUT_PRE_EXEC_1: ${{ secrets.TERRAFORM_MODULES_READ_TOKEN != '' && format('git config --global url."https://x-access-token:{0}@github.com/".insteadOf "https://github.com/"', secrets.TERRAFORM_MODULES_READ_TOKEN) || '' }}
        with:
          tf_path: "terraform"
          tg_version: ${{ inputs.tg_version }}
          tg_dir: ${{ inputs.tg_working_dir }}
          tg_command: "run --all validate"

  # Separate job so that a pull request never gets checks: write: the job is not created for it.
  publish-version:
    if: contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) && !(github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-24.04
    needs: [terragrunt-validate]
    permissions:
      checks: write
    steps:
      - name: Publish Version
        uses: chirpwireless/reusable-github-actions/.github/actions/version-publish@main
        with:
          commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          build-version: ${{ needs.terragrunt-validate.outputs.new_version }}

  publish-release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on:
      group: hetzner-k3s-dev
    needs: [terragrunt-validate, publish-version]
    permissions:
      contents: write
    steps:
      - uses: chirpwireless/reusable-github-actions/.github/actions/publish-release@main
        with:
          version: ${{ needs.terragrunt-validate.outputs.new_version }}
