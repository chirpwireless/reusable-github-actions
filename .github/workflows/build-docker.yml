name: Build a docker image and publish it to Docker registry
on:
  workflow_call:
    inputs:
      service_name:
        description: "The service name to be published to Docker registry"
        type: string
        required: true
      build_args:
        description: "Build arguments to pass to Docker build command (e.g., ARG1=value1 ARG2=value2)"
        type: string
        required: false
      dockerfile:
        description: "Path to the Dockerfile (relative to context)"
        type: string
        required: false
        default: "Dockerfile"
      context:
        description: "Build context path"
        type: string
        required: false
        default: "."
      private_go_modules:
        description: "Pass a GitHub App token to the Docker build as the BuildKit secret gh_token so the Dockerfile can fetch private Go modules (mount it with RUN --mount=type=secret,id=gh_token)"
        type: boolean
        required: false
        default: false
      private_go_module_repositories:
        description: "Comma-separated repositories of the chirpwireless org the private-module token may read (the modules the build fetches); every other repository stays out of the build's reach"
        type: string
        required: false
        default: "go-kit"
      gitlab_token_secret:
        description: "Name of an Actions secret holding a GitLab token; passed to the Docker build as the BuildKit secret gitlab_token (mount it with RUN --mount=type=secret,id=gitlab_token). Empty disables it"
        type: string
        required: false
        default: ""
    outputs:
      new-version:
        description: "The new service version"
        value: ${{ jobs.generate-version.outputs.service-version }}

env:
  HOME: ${{github.workspace}}

jobs:
  generate-version:
    runs-on:
      group: hetzner-k3s-dev
    outputs:
      service-version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        uses: chirpwireless/reusable-github-actions/.github/actions/calendar-version@main
      - name: "Create a summary"
        run: |
          echo "Building a new revision ${{steps.version.outputs.new_version}}" > $GITHUB_STEP_SUMMARY

  build:
    runs-on:
      group: builder
    needs: [generate-version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub App token for private Go modules
        if: ${{ inputs.private_go_modules }}
        uses: actions/create-github-app-token@v1
        id: app-token-chirp-wireless
        with:
          app-id: ${{ secrets.GOLANG_BUILDER_APP_ID }}
          private-key: ${{ secrets.GOLANG_BUILDER_PRIVATE_KEY }}
          owner: "chirpwireless"
          repositories: ${{ inputs.private_go_module_repositories }}
          # The build only reads module sources; without this the token carries every permission of the App.
          permission-contents: read
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}:${{ needs.generate-version.outputs.service-version }}
          build-args: ${{ inputs.build_args }}
          secrets: |
            ${{ inputs.private_go_modules && format('gh_token={0}', steps.app-token-chirp-wireless.outputs.token) || '' }}
            ${{ inputs.gitlab_token_secret != '' && format('gitlab_token={0}', secrets[inputs.gitlab_token_secret]) || '' }}

  publish-version:
    runs-on:
      group: hetzner-k3s-dev
    needs: [generate-version, build]
    permissions:
      checks: write
    steps:
      - name: Publish Version
        uses: chirpwireless/reusable-github-actions/.github/actions/version-publish@main
        with:
          commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          build-version: ${{ needs.generate-version.outputs.service-version }}

  publish-release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on:
      group: hetzner-k3s-dev
    needs: [generate-version, build]
    steps:
      - uses: chirpwireless/reusable-github-actions/.github/actions/publish-release@main
        with:
          version: ${{ needs.generate-version.outputs.service-version }}
