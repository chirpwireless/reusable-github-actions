name: Test actions

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Shell scripts of the actions and workflows
        run: |
          bash tests/content-image.test.sh
          bash tests/deploy-helmfile.test.sh
      - name: version-fetch
        run: node --test tests/*.test.js
