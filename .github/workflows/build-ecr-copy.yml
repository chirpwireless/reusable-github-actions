name: Copy an already pushed ghcr image to AWS ECR
on:
  workflow_call:
    inputs:
      service_name:
        description: "Image name under the organization, as in ghcr.io/<owner>/<service_name>"
        type: string
        required: true
      version:
        description: "Image tag to copy"
        type: string
        required: true

jobs:
  copy:
    runs-on:
      group: builder
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to AWS ECR (optional)
        id: ecr
        uses: chirpwireless/reusable-github-actions/.github/actions/ecr-login@main
        with:
          role-arn: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          registry: ${{ vars.AWS_ECR_REGISTRY }}
      - name: Copy the image to AWS ECR (optional)
        uses: chirpwireless/reusable-github-actions/.github/actions/ecr-copy@main
        with:
          source: ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}:${{ inputs.version }}
          registry: ${{ steps.ecr.outputs.registry }}
          target: ${{ steps.ecr.outputs.registry }}/${{ github.repository_owner }}/${{ inputs.service_name }}:${{ inputs.version }}
