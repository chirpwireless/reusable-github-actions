name: Build a Go library
on:
  workflow_call:
    outputs:
      new-version:
        description: "The new library version"
        value: ${{ jobs.build.outputs.service-version }}

env:
  HOME: ${{github.workspace}}

jobs:
  build:
    runs-on: ${{ (github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('{"group":"builder"}') }}
    permissions:
      contents: read
    outputs:
      service-version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"
      - name: Configure Git to use a read-only token
        if: ${{ !(github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]') }}
        env:
          TOKEN_CHIRPWIRELESS: ${{ secrets.GO_MODULES_READ_TOKEN }}
          TOKEN_CHIRPDEPIN: ${{ secrets.GO_MODULES_READ_TOKEN_DEPIN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN_CHIRPWIRELESS}@github.com/chirpwireless/".insteadOf "https://github.com/chirpwireless/"
          git config --global url."https://x-access-token:${TOKEN_CHIRPDEPIN}@github.com/chirpdepin/".insteadOf "https://github.com/chirpdepin/"
      - name: Configure GitLab netrc
        if: ${{ !(github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]') }}
        env:
          GITLAB_NETRC: ${{ secrets.GITLAB_NETRC }}
        run: printf '%b' "$GITLAB_NETRC" > "${HOME}/.netrc"
      - name: Install dependencies
        run: make install
      - name: Run build
        run: make build
      - name: Run tests
        run: make test
      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          args: --timeout=10m
      - name: Remove credentials
        if: always()
        run: rm -f "${HOME}/.gitconfig" "${HOME}/.netrc"
      - name: Generate Version
        id: version
        uses: chirpwireless/reusable-github-actions/.github/actions/calendar-version@main

  publish-release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on:
      group: builder
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: chirpwireless/reusable-github-actions/.github/actions/publish-release@main
        with:
          version: ${{ needs.build.outputs.service-version }}
