name: Build a Go microservice and publish it to Docker registry
on:
  workflow_call:
    inputs:
      service_name:
        description: "The service name to be published to Docker registry"
        type: string
        required: true
      app_dir:
        description: "Path to the go.mod file"
        type: string
        default: "."
      skip_linter:
        description: "A boolean flag to skip linter checks"
        type: boolean
        default: false
      golangci_lint_version:
        description: "golangci-lint version. A v1.x value keeps the v6 action; a v2.x value switches to the v9 action. Pick a release built with Go at least as new as the module's go directive: v2.12.x for go 1.25, v2.13.x for go 1.26"
        type: string
        default: "v1.64.8"
      generate_docs:
        description: "A boolean flag to generate Swagger docs"
        type: boolean
        default: false
      image_name:
        description: "Image name under ghcr.io/<owner>; empty means service_name"
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile from the repository root"
        type: string
        default: "Dockerfile"
      make_target:
        description: "make target that builds the binary"
        type: string
        default: "build"
      run_checks:
        description: "false skips the tests and the linters; another job of the same commit runs them"
        type: boolean
        default: true
      tag_mode:
        description: "calendar: a version from the date, pushed every build; content: a tag from the content of the inputs, pushed only when absent"
        type: string
        default: "calendar"
      content_inputs_cmd:
        description: "Required for tag_mode content: a command run from the repository root that prints the input file paths, one per line"
        type: string
        default: ""
      version_check_name:
        description: "Name of the check-run that carries the version"
        type: string
        default: "chirp:version"
    outputs:
      new-version:
        description: "The new service version"
        value: ${{ jobs.build.outputs.new_version }}

env:
  HOME: ${{github.workspace}}

jobs:
  build:
    runs-on:
      group: builder
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    env:
      docker_tag: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name || inputs.service_name }}
      BUILDKIT_IMAGE: moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      GOPATH: /tmp/go
      GOMODCACHE: /tmp/go/pkg/mod
      GOPRIVATE: ${{ vars.GOPRIVATE }}
      GONOSUMDB: ${{ vars.GONOSUMDB }}
      GOPROXY: ${{ vars.GOPROXY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the inputs and keep the Docker config out of the workspace
        shell: bash
        env:
          TAG_MODE: ${{ inputs.tag_mode }}
          CONTENT_INPUTS_CMD: ${{ inputs.content_inputs_cmd }}
        run: |
          case "$TAG_MODE" in
            calendar) ;;
            content) [ -n "$CONTENT_INPUTS_CMD" ] || { echo "::error::content_inputs_cmd is required for tag_mode content"; exit 1; } ;;
            *) echo "::error::tag_mode must be calendar or content, got '$TAG_MODE'"; exit 1 ;;
          esac
          # The workspace is HOME, so the default Docker config would sit in the build context.
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - id: calendar
        if: ${{ inputs.tag_mode == 'calendar' }}
        uses: chirpwireless/reusable-github-actions/.github/actions/calendar-version@main
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "${{ inputs.app_dir }}/go.mod"
          cache: false
      - name: Verify Go installation
        run: |
          # Remove any stale go binary from GOPATH/bin that shadows the real one
          GOPATH_BIN="$(go env GOPATH)/bin"
          rm -f "$GOPATH_BIN/go" "$GOPATH_BIN/gofmt" 2>/dev/null || true
          go version
      - name: Set up gotestfmt
        if: ${{ inputs.run_checks }}
        uses: GoTestTools/gotestfmt-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/create-github-app-token@v1
        id: app-token-chirp-wireless
        with:
          app-id: ${{ secrets.GOLANG_BUILDER_APP_ID }}
          private-key: ${{ secrets.GOLANG_BUILDER_PRIVATE_KEY }}
          owner: "chirpwireless"
      - uses: actions/create-github-app-token@v1
        id: app-token-chirp-depin
        with:
          app-id: ${{ secrets.CHIRP_DEPIN_BUILDER_APP_ID }}
          private-key: ${{ secrets.CHIRP_DEPIN_BUILDER_PRIVATE_KEY }}
          owner: "chirpdepin"
      - name: Configure Git to use installation token
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token-chirp-wireless.outputs.token }}@github.com/chirpwireless/".insteadOf "https://github.com/chirpwireless/"
          git config --global url."https://x-access-token:${{ steps.app-token-chirp-depin.outputs.token }}@github.com/chirpdepin/".insteadOf "https://github.com/chirpdepin/"
          printf "${{ secrets.GITLAB_NETRC }}" > ~/.netrc
      - name: Generate swagger docs
        if: ${{ inputs.generate_docs == true }}
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          make swagger
      - name: Install dependencies
        run: make install
      - id: content
        if: ${{ inputs.tag_mode == 'content' }}
        uses: chirpwireless/reusable-github-actions/.github/actions/content-tag@main
        with:
          inputs-cmd: ${{ inputs.content_inputs_cmd }}
          dockerfile: ${{ inputs.dockerfile }}
          buildkit-image: ${{ env.BUILDKIT_IMAGE }}
          version-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: version
        shell: bash
        env:
          TAG_MODE: ${{ inputs.tag_mode }}
          CALENDAR: ${{ steps.calendar.outputs.new_version }}
          CONTENT: ${{ steps.content.outputs.tag }}
        run: |
          if [ "$TAG_MODE" = content ]; then version=$CONTENT; else version=$CALENDAR; fi
          [ -n "$version" ] || { echo "::error::no version computed"; exit 1; }
          echo "new_version=$version" >> "$GITHUB_OUTPUT"
          echo "Building a new revision $version" > "$GITHUB_STEP_SUMMARY"
      - name: Run build
        env:
          MAKE_TARGET: ${{ inputs.make_target }}
        run: make "$MAKE_TARGET"
      - name: Run tests
        if: ${{ inputs.run_checks }}
        run: |
          cd ${{ inputs.app_dir}} && go mod download && go test -v ./... -cover -coverprofile=coverage.txt
      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        if: ${{ inputs.run_checks && inputs.skip_linter == false && startsWith(inputs.golangci_lint_version, 'v1.') }}
        with:
          version: ${{ inputs.golangci_lint_version }}
          working-directory: ${{ inputs.app_dir }}
          args: --timeout=10m
      - name: Run linter (golangci-lint v2)
        uses: golangci/golangci-lint-action@v9
        if: ${{ inputs.run_checks && inputs.skip_linter == false && !startsWith(inputs.golangci_lint_version, 'v1.') }}
        with:
          version: ${{ inputs.golangci_lint_version }}
          working-directory: ${{ inputs.app_dir }}
          args: --timeout=10m
      - name: Set up Docker Buildx
        if: ${{ inputs.tag_mode == 'calendar' }}
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        id: push-image
        if: ${{ inputs.tag_mode == 'calendar' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ env.docker_tag }}:${{ steps.version.outputs.new_version }}
          cache-from: type=registry,ref=${{ env.docker_tag }}:buildcache
          cache-to: type=registry,ref=${{ env.docker_tag }}:buildcache,mode=max
      - name: Record the image digest
        if: ${{ inputs.tag_mode == 'calendar' }}
        uses: chirpwireless/reusable-github-actions/.github/actions/image-digest-record@main
        with:
          image: ${{ env.docker_tag }}
          tag: ${{ steps.version.outputs.new_version }}
          digest: ${{ steps.push-image.outputs.digest }}
      - id: content-build
        name: Build the content-tagged image
        if: ${{ inputs.tag_mode == 'content' }}
        uses: chirpwireless/reusable-github-actions/.github/actions/content-image-build@main
        with:
          image: ${{ env.docker_tag }}
          tag: ${{ steps.version.outputs.new_version }}
          dockerfile: ${{ inputs.dockerfile }}
          buildkit-image: ${{ env.BUILDKIT_IMAGE }}
      - name: Push the content-tagged image when its tag is absent
        if: ${{ inputs.tag_mode == 'content' }}
        uses: chirpwireless/reusable-github-actions/.github/actions/content-image-publish@main
        with:
          image: ${{ env.docker_tag }}
          tag: ${{ steps.version.outputs.new_version }}
          dockerfile: ${{ inputs.dockerfile }}
          buildkit-image: ${{ env.BUILDKIT_IMAGE }}
          built-config: ${{ steps.content-build.outputs.config }}
      - name: Publish Version
        if: ${{ inputs.tag_mode == 'calendar' || steps.content.outputs.publish == 'true' }}
        uses: chirpwireless/reusable-github-actions/.github/actions/version-publish@main
        with:
          commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          build-version: ${{ steps.version.outputs.new_version }}
          check-name: ${{ inputs.version_check_name }}

  publish-release:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && inputs.tag_mode == 'calendar'
    runs-on:
      group: hetzner-k3s-dev
    needs: [build]
    steps:
      - uses: chirpwireless/reusable-github-actions/.github/actions/publish-release@main
        with:
          version: ${{ needs.build.outputs.new_version }}
