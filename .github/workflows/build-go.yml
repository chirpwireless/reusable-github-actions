name: Build a Go microservice and publish it to Docker registry
on:
  workflow_call:
    inputs:
      service_name:
        description: "The service name to be published to Docker registry"
        type: string
        required: true
      app_dir:
        description: "Path to the go.mod file"
        type: string
        default: "."
      skip_linter:
        description: "A boolean flag to skip linter checks"
        type: boolean
        default: false
      golangci_lint_version:
        description: "golangci-lint version. A v1.x value keeps the v6 action; a v2.x value switches to the v9 action. Pick a release built with Go at least as new as the module's go directive: v2.12.x for go 1.25, v2.13.x for go 1.26"
        type: string
        default: "v1.64.8"
      generate_docs:
        description: "A boolean flag to generate Swagger docs"
        type: boolean
        default: false
      image_name:
        description: "Docker image name under the owner namespace. Defaults to service_name"
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile from the repository root"
        type: string
        default: "Dockerfile"
      make_target:
        description: "make target that builds the binary"
        type: string
        default: "build"
      run_checks:
        description: "false skips the tests and the linter"
        type: boolean
        default: true
      tag_mode:
        description: "calendar (version from the date) or content (tag from the content of the inputs, pushed only when absent)"
        type: string
        default: "calendar"
      content_inputs_cmd:
        description: "Required for tag_mode content: command run from the repository root that prints the input file paths, one per line"
        type: string
        default: ""
      version_check_name:
        description: "Name of the check-run that carries the version"
        type: string
        default: "chirp:version"
    outputs:
      new-version:
        description: "The new service version"
        value: ${{ jobs.build.outputs.new_version }}

env:
  HOME: ${{github.workspace}}

jobs:
  build:
    runs-on:
      group: builder
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    env:
      docker_tag: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name || inputs.service_name }}
      BUILDKIT_IMAGE: moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      GOPATH: /tmp/go
      GOMODCACHE: /tmp/go/pkg/mod
      GOPRIVATE: ${{ vars.GOPRIVATE }}
      GONOSUMDB: ${{ vars.GONOSUMDB }}
      GOPROXY: ${{ vars.GOPROXY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: built
        name: Record the built commit
        if: ${{ inputs.tag_mode == 'content' }}
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: calendar
        if: ${{ inputs.tag_mode == 'calendar' }}
        uses: chirpwireless/reusable-github-actions/.github/actions/calendar-version@main
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "${{ inputs.app_dir }}/go.mod"
          cache: false
      - name: Verify Go installation
        run: |
          # Remove any stale go binary from GOPATH/bin that shadows the real one
          GOPATH_BIN="$(go env GOPATH)/bin"
          rm -f "$GOPATH_BIN/go" "$GOPATH_BIN/gofmt" 2>/dev/null || true
          go version
      - name: Set up gotestfmt
        if: ${{ inputs.run_checks }}
        uses: GoTestTools/gotestfmt-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/create-github-app-token@v1
        id: app-token-chirp-wireless
        with:
          app-id: ${{ secrets.GOLANG_BUILDER_APP_ID }}
          private-key: ${{ secrets.GOLANG_BUILDER_PRIVATE_KEY }}
          owner: "chirpwireless"
      - uses: actions/create-github-app-token@v1
        id: app-token-chirp-depin
        with:
          app-id: ${{ secrets.CHIRP_DEPIN_BUILDER_APP_ID }}
          private-key: ${{ secrets.CHIRP_DEPIN_BUILDER_PRIVATE_KEY }}
          owner: "chirpdepin"
      - name: Configure Git to use installation token
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token-chirp-wireless.outputs.token }}@github.com/chirpwireless/".insteadOf "https://github.com/chirpwireless/"
          git config --global url."https://x-access-token:${{ steps.app-token-chirp-depin.outputs.token }}@github.com/chirpdepin/".insteadOf "https://github.com/chirpdepin/"
          printf "${{ secrets.GITLAB_NETRC }}" > ~/.netrc
      - name: Generate swagger docs
        if: ${{ inputs.generate_docs == true }}
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          make swagger
      - name: Install dependencies
        run: make install
      - id: content
        name: Compute the content tag
        if: ${{ inputs.tag_mode == 'content' }}
        shell: bash
        env:
          CONTENT_INPUTS_CMD: ${{ inputs.content_inputs_cmd }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          if [ -z "$CONTENT_INPUTS_CMD" ]; then
            echo "::error::content_inputs_cmd is required for tag_mode content"
            exit 1
          fi
          root=$(realpath -- .)
          raw=$(mktemp)
          bash -c "set -euo pipefail; $CONTENT_INPUTS_CMD" > "$raw"
          if ! grep -q . "$raw"; then
            echo "::error::content_inputs_cmd printed no paths"
            exit 1
          fi
          paths=$(mktemp)
          while IFS= read -r line || [ -n "$line" ]; do
            if [ -n "$line" ]; then printf '%s\n' "$line" >> "$paths"; fi
          done < "$raw"
          printf '%s\n' "$DOCKERFILE" >> "$paths"
          LC_ALL=C sort -u "$paths" -o "$paths"
          list=$(mktemp)
          while IFS= read -r path; do
            case "$path" in
              /*) echo "::error::absolute path in the inputs: $path"; exit 1 ;;
              *$'\r'*) echo "::error::carriage return in the inputs path"; exit 1 ;;
            esac
            if [ -L "$path" ] || [ ! -f "$path" ]; then
              echo "::error::not a regular file: $path"
              exit 1
            fi
            real=$(realpath -e -- "$path")
            case "$real" in
              "$root"/*) ;;
              *) echo "::error::path outside the repository: $path"; exit 1 ;;
            esac
            sum=$(sha256sum -- "$path")
            printf '%s\t%s\n' "$path" "${sum%% *}" >> "$list"
          done < "$paths"
          printf 'buildkit\t%s\n' "$BUILDKIT_IMAGE" >> "$list"
          LC_ALL=C sort "$list" -o "$list"
          echo "Content inputs:"
          cat "$list"
          hash=$(sha256sum "$list" | cut -d' ' -f1)
          echo "tag=c-${hash:0:16}" >> "$GITHUB_OUTPUT"
      - id: version
        shell: bash
        env:
          TAG_MODE: ${{ inputs.tag_mode }}
          CALENDAR: ${{ steps.calendar.outputs.new_version }}
          CONTENT: ${{ steps.content.outputs.tag }}
        run: |
          case "$TAG_MODE" in
            calendar|content) ;;
            *) echo "::error::tag_mode must be calendar or content, got '$TAG_MODE'"; exit 1 ;;
          esac
          echo "new_version=${CALENDAR:-$CONTENT}" >> "$GITHUB_OUTPUT"
      - name: "Create a summary"
        run: |
          echo "Building a new revision ${{steps.version.outputs.new_version}}" > $GITHUB_STEP_SUMMARY
      - name: Set up Docker Buildx (pinned BuildKit)
        if: ${{ inputs.tag_mode == 'content' }}
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Set up Docker Buildx
        if: ${{ inputs.tag_mode == 'calendar' }}
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: registry
        name: Check the tag in the registry
        if: ${{ inputs.tag_mode == 'content' }}
        shell: bash
        env:
          IMAGE: ${{ env.docker_tag }}
          TAG: ${{ steps.version.outputs.new_version }}
        run: |
          set -uo pipefail
          manifest="$RUNNER_TEMP/registry-manifest.json"
          errfile="$RUNNER_TEMP/registry-inspect.err"
          if docker buildx imagetools inspect --raw "$IMAGE:$TAG" > "$manifest" 2> "$errfile"; then
            media=$(jq -r '.mediaType // empty' "$manifest")
            case "$media" in
              application/vnd.docker.distribution.manifest.v2+json|application/vnd.oci.image.manifest.v1+json) ;;
              *) echo "::error::$IMAGE:$TAG is not a single-platform image manifest (mediaType '$media')"; exit 1 ;;
            esac
            config=$(jq -r '.config.digest // empty' "$manifest")
            if ! printf '%s' "$config" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::$IMAGE:$TAG has no valid config digest in the registry manifest"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "config=$config" >> "$GITHUB_OUTPUT"
          else
            out=$(cat "$errfile")
            case "$out" in
              *": not found") echo "exists=false" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::cannot inspect $IMAGE:$TAG: $out"; exit 1 ;;
            esac
          fi
      - name: Run build
        env:
          MAKE_TARGET: ${{ inputs.make_target }}
        run: make "$MAKE_TARGET"
      - name: Run tests
        if: ${{ inputs.run_checks }}
        run: |
          cd ${{ inputs.app_dir}} && go mod download && go test -v ./... -cover -coverprofile=coverage.txt
      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        if: ${{ inputs.run_checks && inputs.skip_linter == false && startsWith(inputs.golangci_lint_version, 'v1.') }}
        with:
          version: ${{ inputs.golangci_lint_version }}
          working-directory: ${{ inputs.app_dir }}
          args: --timeout=10m
      - name: Run linter (golangci-lint v2)
        uses: golangci/golangci-lint-action@v9
        if: ${{ inputs.run_checks && inputs.skip_linter == false && !startsWith(inputs.golangci_lint_version, 'v1.') }}
        with:
          version: ${{ inputs.golangci_lint_version }}
          working-directory: ${{ inputs.app_dir }}
          args: --timeout=10m
      - name: Build and push Docker image
        if: ${{ inputs.tag_mode == 'calendar' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ env.docker_tag }}:${{ steps.version.outputs.new_version }}
          cache-from: type=registry,ref=${{ env.docker_tag }}:buildcache
          cache-to: type=registry,ref=${{ env.docker_tag }}:buildcache,mode=max
      - id: image
        name: Build the reproducible image
        if: ${{ inputs.tag_mode == 'content' }}
        uses: docker/build-push-action@v5
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          no-cache: true
          outputs: type=image,name=${{ env.docker_tag }}:${{ steps.version.outputs.new_version }},push=${{ steps.registry.outputs.exists != 'true' }},rewrite-timestamp=true
      - name: Compare the image with the registry
        if: ${{ inputs.tag_mode == 'content' }}
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.new_version }}
          EXISTS: ${{ steps.registry.outputs.exists }}
          REGISTRY_CONFIG: ${{ steps.registry.outputs.config }}
          METADATA: ${{ steps.image.outputs.metadata }}
        run: |
          set -uo pipefail
          built=$(printf '%s' "$METADATA" | jq -r '.["containerimage.config.digest"] // empty')
          if ! printf '%s' "$built" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            pushed=true
            [ "$EXISTS" != "true" ] || pushed=false
            echo "content-image tag=$TAG built_config=missing registry_config=${REGISTRY_CONFIG:-absent} pushed=$pushed"
            echo "::error::the build did not report a config digest"
            exit 1
          fi
          if [ "$EXISTS" != "true" ]; then
            echo "content-image tag=$TAG built_config=$built registry_config=absent pushed=true"
            exit 0
          fi
          echo "content-image tag=$TAG built_config=$built registry_config=$REGISTRY_CONFIG pushed=false"
          if [ "$built" != "$REGISTRY_CONFIG" ]; then
            echo "::error::the build is not reproducible: built $built, registry $REGISTRY_CONFIG"
            exit 1
          fi
      - id: publishable
        name: Check that the built commit is the one the version is published on
        if: ${{ inputs.tag_mode == 'content' }}
        shell: bash
        env:
          VERSION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILT_SHA: ${{ steps.built.outputs.sha }}
        run: |
          if [ "$BUILT_SHA" = "$VERSION_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the built commit differs from $VERSION_SHA (merge ref or base checkout): the version check is not published"
          fi
      - name: Publish Version
        if: ${{ inputs.tag_mode == 'calendar' || steps.publishable.outputs.publish == 'true' }}
        uses: chirpwireless/reusable-github-actions/.github/actions/version-publish@main
        with:
          commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          build-version: ${{ steps.version.outputs.new_version }}
          check-name: ${{ inputs.version_check_name }}

  publish-release:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && inputs.tag_mode == 'calendar'
    runs-on:
      group: hetzner-k3s-dev
    needs: [build]
    steps:
      - uses: chirpwireless/reusable-github-actions/.github/actions/publish-release@main
        with:
          version: ${{ needs.build.outputs.new_version }}
